<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps dev harness</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/maps.css">
<script type="importmap">{"imports": {"three": "../vendor/three.module.min.js"}}</script>
<style>
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12.5px; }
  #bar button { font: inherit; padding: 4px 10px; cursor: pointer; background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; }
  #map { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #log { color: var(--text-3); font-family: var(--font-mono); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="bar">
  <strong>Maps harness</strong>
  <button id="prev" type="button">&minus;1 day</button>
  <button id="next" type="button">+1 day</button>
  <button id="now" type="button">Now</button>
  <button id="a11" type="button">Apollo 11 landing</button>
  <button id="theme" type="button">Toggle theme</button>
  <button id="act" type="button">Toggle active scenario</button>
  <span id="log"></span>
</div>
<div id="map"></div>
<script type="module" src="./maps-harness.js"></script>
</body>
</html>
